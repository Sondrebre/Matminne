<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: header_links}"></div>
    <title>Venneveggen | MatMinne</title>

    <style>
        body { background: #fafafa; }

        /* ── TOP BAR ── */
        .feed-topbar {
            background: white;
            border-bottom: 1px solid #efefef;
            padding: 12px 0;
            position: sticky; top: 56px; z-index: 50;
        }
        .feed-topbar-inner {
            max-width: 480px; margin: 0 auto; padding: 0 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .feed-topbar-title {
            font-size: 1.05rem; font-weight: 900; color: var(--mat-mork);
            letter-spacing: -.5px; flex-shrink: 0;
        }
        .feed-search-form {
            flex: 1; display: flex; align-items: center;
            background: #f5f5f5; border-radius: 12px;
            overflow: hidden; border: 1.5px solid transparent;
            transition: border-color .2s;
        }
        .feed-search-form:focus-within { border-color: var(--mat-gronn); background: white; }
        .feed-search-form input {
            flex: 1; border: none; outline: none; padding: 8px 12px;
            font-size: .85rem; font-family: inherit; background: transparent;
            color: var(--mat-mork);
        }
        .feed-search-form input::placeholder { color: #aaa; }
        .feed-search-form button {
            background: none; border: none; padding: 8px 12px;
            color: #aaa; cursor: pointer; font-size: .85rem;
            transition: color .2s;
        }
        .feed-search-form:focus-within button { color: var(--mat-gronn); }

        /* ── FEED LAYOUT ── */
        .feed-wrap {
            max-width: 480px;
            margin: 16px auto 100px;
            padding: 0;
        }

        /* ── POST CARD ── */
        .post-card {
            background: white;
            border-radius: 0;
            border-bottom: 1px solid #efefef;
            margin-bottom: 0;
            overflow: hidden;
        }
        @media (min-width: 540px) {
            .post-card {
                border-radius: 18px;
                border: 1px solid #efefef;
                margin-bottom: 16px;
                box-shadow: 0 2px 12px rgba(0,0,0,.05);
            }
        }

        .post-header {
            padding: 12px 14px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .post-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--mat-gronn), var(--mat-mork));
            color: white;
            font-weight: 800;
            font-size: .85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px solid #e8f5e9;
        }

        .post-username { font-weight: 700; font-size: .88rem; color: var(--mat-mork); line-height: 1.2; }
        .post-time { font-size: .7rem; color: #999; margin-top: 1px; }

        .post-kat {
            background: rgba(15,30,20,.72); backdrop-filter: blur(8px);
            color: #86efac; font-size: .62rem; font-weight: 800;
            padding: 4px 9px; border-radius: 99px; letter-spacing: .5px;
        }

        .post-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        /* ── INSTAGRAM-STYLE ACTIONS ── */
        .post-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 8px 10px 4px;
        }

        .btn-post-icon {
            display: flex; align-items: center; gap: 5px;
            background: none; border: none; cursor: pointer;
            color: #262626; font-size: 1.35rem; font-weight: 700;
            padding: 6px 7px; border-radius: 8px; transition: transform .1s, opacity .15s;
            font-family: inherit; line-height: 1;
        }
        .btn-post-icon span { font-size: .8rem; color: #555; font-weight: 700; }
        .btn-post-icon:hover { opacity: .65; }
        .btn-post-icon:active { transform: scale(.88); }
        .btn-post-icon.liked { color: #ef4444; }
        .btn-post-icon.liked span { color: #ef4444; }
        .btn-post-icon.saved { color: var(--mat-gronn); }

        .post-actions-spacer { flex: 1; }

        .post-body { padding: 4px 14px 14px; }

        .post-likes {
            font-weight: 800; font-size: .82rem; color: var(--mat-mork);
            margin-bottom: 4px;
        }

        .post-title-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
        .post-author-inline { font-weight: 800; font-size: .85rem; color: var(--mat-mork); }
        .post-title {
            font-weight: 500;
            font-size: .85rem;
            color: var(--mat-mork);
            text-decoration: none;
            display: inline;
            transition: color .2s;
        }
        .post-title:hover { color: var(--mat-gronn); }

        .post-meta {
            display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap;
        }
        .post-meta span {
            font-size: .72rem; font-weight: 600; color: #aaa;
            display: flex; align-items: center; gap: 4px;
        }
        .post-meta i { color: #ccc; font-size: .65rem; }

        .post-see-link {
            font-size: .75rem; color: var(--mat-gronn); font-weight: 700;
            text-decoration: none; display: inline-block; margin-top: 8px;
        }
        .post-see-link:hover { text-decoration: underline; }

        /* ── KOMMENTARSEKSJON ── */
        .kommentar-seksjon {
            border-top: 1px solid #f1f5f9;
            padding: 12px 14px 14px;
            background: white;
        }
        .kommentar-item {
            display: flex; gap: 9px; margin-bottom: 8px; align-items: flex-start;
        }
        .kommentar-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--mat-gronn); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: .65rem; font-weight: 800; flex-shrink: 0;
        }
        .kommentar-body { flex: 1; min-width: 0; }
        .kommentar-navn {
            font-weight: 700; font-size: .78rem; color: var(--mat-mork);
            display: inline; margin-right: 4px;
        }
        .kommentar-tekst {
            font-size: .82rem; color: #333; line-height: 1.4; display: inline;
        }
        .kommentar-input-wrap {
            display: flex; gap: 8px; margin-top: 10px; align-items: center;
            border-top: 1px solid #f5f5f5; padding-top: 10px;
        }
        .kommentar-input {
            flex: 1; border: none; border-bottom: 1.5px solid #e2e8f0;
            border-radius: 0; padding: 6px 2px; font-family: inherit;
            font-size: .85rem; outline: none; transition: border-color .2s;
            background: transparent; color: var(--mat-mork);
        }
        .kommentar-input:focus { border-color: var(--mat-gronn); }
        .kommentar-send {
            background: none; color: var(--mat-gronn); border: none;
            font-size: .8rem; font-weight: 800; cursor: pointer;
            padding: 4px 8px; transition: opacity .2s; font-family: inherit;
        }
        .kommentar-send:hover { opacity: .7; }
        .kommentar-se-alle {
            display: block; font-size: .75rem; color: #999;
            font-weight: 600; text-decoration: none; margin-bottom: 8px;
        }
        .kommentar-se-alle:hover { color: var(--mat-gronn); }

        /* ── EMPTY STATE ── */
        .empty-feed {
            text-align: center; padding: 60px 24px;
            background: white; border-radius: 18px;
            border: 1.5px dashed #e2e8f0; margin: 20px 16px;
        }
        .empty-feed .empty-icon {
            width: 72px; height: 72px; background: #f0fdf4;
            border-radius: 20px; display: flex; align-items: center;
            justify-content: center; font-size: 2.2rem; margin: 0 auto 18px;
        }
        .empty-feed h4 { font-weight: 900; color: var(--mat-mork); font-size: 1.1rem; margin-bottom: 6px; }
        .empty-feed p { color: #94a3b8; margin-bottom: 22px; font-size: .88rem; }
        .btn-find {
            background: var(--mat-gronn); color: white; text-decoration: none;
            padding: 11px 24px; border-radius: 12px; font-weight: 800;
            font-size: .88rem; display: inline-flex; align-items: center;
            gap: 8px; transition: .2s; box-shadow: 0 6px 18px rgba(46,204,113,.25);
        }
        .btn-find:hover { background: var(--mat-gronn-m); color: white; }

        /* ── SEARCH RESULTS ── */
        .search-results-wrap {
            max-width: 480px; margin: 0 auto 12px; padding: 0 16px;
        }
        .search-results-label {
            font-size: .68rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; color: #aaa; margin-bottom: 8px;
        }
        .person-card {
            background: white; border-radius: 14px; padding: 12px 16px;
            display: flex; align-items: center; gap: 12px; margin-bottom: 6px;
            border: 1px solid #efefef;
        }
        .person-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--mat-gronn), var(--mat-mork));
            color: white; font-weight: 900; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .person-name { font-weight: 800; font-size: .92rem; color: var(--mat-mork); margin: 0; }
        .person-sub  { font-size: .74rem; color: #aaa; font-weight: 600; }
        .btn-person-follow {
            background: var(--mat-gronn); color: white; border: none;
            padding: 7px 16px; border-radius: 10px; font-weight: 800;
            font-size: .8rem; cursor: pointer; transition: .2s; font-family: inherit;
            white-space: nowrap;
        }
        .btn-person-follow:hover { background: var(--mat-gronn-m); }
        .btn-person-unfollow {
            background: #f1f5f9; color: #64748b; border: none;
            padding: 7px 16px; border-radius: 10px; font-weight: 800;
            font-size: .8rem; cursor: pointer; transition: .2s; font-family: inherit;
            white-space: nowrap;
        }
        .btn-person-unfollow:hover { background: #fee2e2; color: #dc2626; }

        @media (max-width: 540px) {
            .feed-wrap { margin-top: 8px; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <!-- TOP BAR med søk -->
    <div class="feed-topbar">
        <div class="feed-topbar-inner">
            <span class="feed-topbar-title">Venner</span>
            <form th:action="@{/vennefeed}" method="get" class="feed-search-form">
                <input type="text" name="sok" placeholder="Søk etter kokker…"
                       th:value="${sokeTekst}" autocomplete="off">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </div>

    <!-- SEARCH RESULTS -->
    <div class="search-results-wrap" th:if="${sokResultater != null}">
        <div class="search-results-label"
             th:text="${sokResultater.isEmpty() ? 'Ingen treff' : sokResultater.size() + ' person(er) funnet'}"></div>

        <div th:each="bruker : ${sokResultater}" class="person-card">
            <img th:if="${bruker.bildeUrl != null}" class="person-avatar"
                 th:src="${bruker.bildeUrl}" alt="" style="object-fit:cover;">
            <div th:unless="${bruker.bildeUrl != null}" class="person-avatar"
                 th:text="${#strings.substring(bruker.fulltNavn, 0, 1)}">N</div>
            <div style="flex:1;min-width:0;">
                <p class="person-name" th:text="${bruker.fulltNavn}">Navn</p>
                <p class="person-sub">MatMinne-kokk</p>
            </div>
            <form th:if="${fulgteBrukerIds != null and fulgteBrukerIds.contains(bruker.id)}"
                  th:action="@{'/slutt-å-følge/' + ${bruker.epost}}" method="post">
                <button type="submit" class="btn-person-unfollow">Følger</button>
            </form>
            <form th:unless="${fulgteBrukerIds != null and fulgteBrukerIds.contains(bruker.id)}"
                  th:action="@{'/følg/' + ${bruker.epost}}" method="post">
                <button type="submit" class="btn-person-follow">Følg</button>
            </form>
        </div>
    </div>

    <div class="feed-wrap">

        <!-- EMPTY STATE -->
        <div th:if="${oppskrifter.isEmpty()}" class="empty-feed">
            <div class="empty-icon">🥗</div>
            <h4>Ganske tomt her ennå</h4>
            <p>Følg andre kokker for å se hva de lager! Finn folk under "Utforsk".</p>
            <a href="/oppdag" class="btn-find">
                <i class="fa-solid fa-compass"></i> Finn folk å følge
            </a>
        </div>

        <!-- FEED POSTS -->
        <div th:each="o : ${oppskrifter}" class="post-card">
            <div class="post-header">
                <a th:href="@{'/profil/' + ${o.brukerEpost}}" class="post-user">
                    <img th:if="${brukerBildeMap != null and brukerBildeMap.containsKey(o.brukerEpost)}"
                         class="post-avatar" th:src="${brukerBildeMap.get(o.brukerEpost)}" alt="" style="object-fit:cover;">
                    <div th:unless="${brukerBildeMap != null and brukerBildeMap.containsKey(o.brukerEpost)}"
                         class="post-avatar" th:text="${#strings.substring(o.brukerNavn, 0, 1)}">U</div>
                    <div>
                        <div class="post-username" th:text="${o.brukerNavn}">Navn</div>
                        <div class="post-time"><i class="fa-regular fa-clock me-1"></i>
                            <span th:text="${o.datoOpprettet != null ? #temporals.format(o.datoOpprettet, 'dd.MM.yy') : 'nylig'}">nylig</span>
                        </div>
                    </div>
                </a>
            </div>

            <div style="position:relative;">
                <img class="post-img"
                     th:src="${o.bildeUrl != null && o.bildeUrl != '' ? o.bildeUrl : 'https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=600&q=70'}"
                     alt="" loading="lazy" decoding="async">
                <span th:if="${o.kategori != null}" class="post-kat"
                      style="position:absolute;top:10px;right:10px;"
                      th:text="${o.kategori}"></span>
            </div>

            <!-- ACTIONS (instagram-stil: rett under bildet) -->
            <div class="post-actions">
                <button class="btn-post-icon"
                        th:classappend="${erLiktMap != null and erLiktMap[o.id] ? ' liked' : ''}"
                        th:attr="data-id=${o.id}"
                        onclick="toggleLik(this)">
                    <i th:class="${erLiktMap != null and erLiktMap[o.id] ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                </button>
                <button class="btn-post-icon"
                        th:attr="data-id=${o.id}"
                        onclick="toggleKommentarer(this)">
                    <i class="fa-regular fa-comment"></i>
                </button>
                <div class="post-actions-spacer"></div>
                <button th:if="${brukerEpost != null}" class="btn-post-icon"
                        th:attr="data-id=${o.id}" onclick="lagrePost(this)" title="Lagre">
                    <i class="fa-regular fa-bookmark"></i>
                </button>
            </div>

            <!-- POST BODY -->
            <div class="post-body">
                <div class="post-likes"
                     th:if="${likeAntallMap != null and likeAntallMap[o.id] != null and likeAntallMap[o.id] > 0}"
                     th:text="${likeAntallMap[o.id]} + ' likes'"></div>
                <div class="post-title-row">
                    <span class="post-author-inline" th:text="${o.brukerNavn}">Navn</span>
                    <a th:href="@{'/detaljer/' + ${o.id}}" class="post-title" th:text="${o.tittel}">Tittel</a>
                </div>
                <div class="post-meta">
                    <span th:if="${o.tilberedningstid != null}">
                        <i class="fas fa-clock"></i><span th:text="${o.tilberedningstid} + ' min'"></span>
                    </span>
                    <span th:if="${o.porsjoner != null}">
                        <i class="fas fa-users"></i><span th:text="${o.porsjoner} + ' pors.'"></span>
                    </span>
                </div>
                <a th:if="${kommentarAntallMap != null and kommentarAntallMap[o.id] != null and kommentarAntallMap[o.id] > 0}"
                   th:href="@{'/detaljer/' + ${o.id}}" class="post-see-link"
                   th:text="'Se alle ' + ${kommentarAntallMap[o.id]} + ' kommentarer'"></a>
            </div>

            <!-- Kommentar-seksjon -->
            <div class="kommentar-seksjon" th:id="'ks-' + ${o.id}" style="display:none;"
                 th:attr="data-id=${o.id}">
                <div th:id="'kl-' + ${o.id}"></div>
                <div class="kommentar-input-wrap" th:if="${brukerEpost != null}">
                    <input type="text" class="kommentar-input"
                           th:id="'ki-' + ${o.id}" placeholder="Legg til en kommentar…"
                           th:attr="data-id=${o.id}"
                           onkeydown="if(event.key==='Enter') sendKommentar(this)">
                    <button class="kommentar-send" th:attr="data-id=${o.id}"
                            onclick="sendKommentar(document.getElementById('ki-'+this.dataset.id))">
                        Legg ut
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div th:replace="~{fragments :: bottom_nav}"></div>
    <div th:replace="~{fragments :: scripts}"></div>

<script>
function toggleLik(btn) {
    const id = btn.dataset.id;
    csrfFetch('/api/lik/' + id, { method: 'POST' })
        .then(r => r.json())
        .then(d => {
            btn.classList.toggle('liked', d.erLikt);
            const ico = btn.querySelector('i');
            ico.className = d.erLikt ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
            // oppdater likes-teller i post-body
            const card = btn.closest('.post-card');
            if (card) {
                let likesDiv = card.querySelector('.post-likes');
                if (!likesDiv && d.likeAntall > 0) {
                    likesDiv = document.createElement('div');
                    likesDiv.className = 'post-likes';
                    const body = card.querySelector('.post-body');
                    if (body) body.prepend(likesDiv);
                }
                if (likesDiv) {
                    likesDiv.textContent = d.likeAntall > 0 ? d.likeAntall + ' likes' : '';
                    likesDiv.style.display = d.likeAntall > 0 ? '' : 'none';
                }
            }
        }).catch(() => {});
}

function toggleKommentarer(btn) {
    const id = btn.dataset.id;
    const seksjon = document.getElementById('ks-' + id);
    if (!seksjon) return;
    const open = seksjon.style.display !== 'none';
    if (open) { seksjon.style.display = 'none'; return; }
    seksjon.style.display = 'block';
    const liste = document.getElementById('kl-' + id);
    if (liste && !liste.dataset.lastet) {
        fetch('/api/kommentarer/' + id)
            .then(r => r.json())
            .then(kommentarer => {
                liste.dataset.lastet = '1';
                if (!kommentarer.length) { liste.innerHTML = '<p style="color:#94a3b8;font-size:.85rem;margin:0 0 8px;">Ingen kommentarer ennå.</p>'; return; }
                liste.innerHTML = kommentarer.map(k => kommentarHtml(k)).join('');
            }).catch(() => {});
    }
}

function sendKommentar(input) {
    const id = input.dataset.id;
    const tekst = input.value.trim();
    if (!tekst) return;
    const fd = new FormData();
    fd.append('tekst', tekst);
    csrfFetch('/api/kommentar/' + id, { method: 'POST', body: fd })
        .then(r => r.json())
        .then(k => {
            const liste = document.getElementById('kl-' + id);
            if (liste) {
                liste.dataset.lastet = '1';
                liste.innerHTML += kommentarHtml(k);
            }
            input.value = '';
            // oppdater teller
            const komBtn = document.querySelector(`.btn-post-icon[data-id="${id}"]:nth-child(2)`);
            // finn kommentarknappen etter likeknappen
            const allBtns = document.querySelectorAll(`.btn-post-icon[data-id="${id}"]`);
            allBtns.forEach(b => { if (b.querySelector('.fa-comment, .fa-regular.fa-comment')) { const s = b.querySelector('span'); if(s) s.textContent = parseInt(s.textContent||0)+1; } });
        }).catch(() => {});
}

function lagrePost(btn) {
    const id = btn.dataset.id;
    const fd = new FormData();
    csrfFetch('/kopier/' + id, { method: 'POST', body: fd })
        .then(r => {
            if (r.redirected || r.ok) {
                btn.querySelector('i').className = 'fa-solid fa-bookmark';
                btn.title = 'Lagret!';
                btn.disabled = true;
            }
        }).catch(() => {});
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function kommentarHtml(k) {
    const initial = escHtml((k.brukerNavn || '?')[0].toUpperCase());
    return `<div class="kommentar-item">
        <div class="kommentar-avatar">${initial}</div>
        <div class="kommentar-body">
            <span class="kommentar-navn">${escHtml(k.brukerNavn)}</span>
            <span class="kommentar-tekst">${escHtml(k.tekst)}</span>
        </div>
    </div>`;
}
</script>
</body>
</html>
